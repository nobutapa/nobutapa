<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="rc"><rect x="0" y="0" width="32" height="32" rx="6" ry="6"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f7a"/>
      <stop offset="0.45" stop-color="#7a3f8e"/>
      <stop offset="0.72" stop-color="#d65a3a"/>
      <stop offset="0.9" stop-color="#ff8e2a"/>
      <stop offset="1" stop-color="#ffd476"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffe48a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffaa3c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff6e00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.46" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.6" stop-color="#ffe89a"/>
      <stop offset="1" stop-color="#ffc94a"/>
    </radialGradient>
    <clipPath id="sunClip"><circle cx="16" cy="16" r="6"/></clipPath>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fd0"/>
      <stop offset="1" stop-color="#13408a"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3d8de"/>
      <stop offset="1" stop-color="#5e646c"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a72"/>
      <stop offset="1" stop-color="#6a5292"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#3a200f"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#rc)">
    <!-- Ciel sunset (éclairci) -->
    <rect x="0" y="0" width="32" height="16" fill="url(#sky)"/>

    <!-- Montagnes simplifiées et plus claires -->
    <path d="M0,16 L0,12 L4,10.5 L8,12 L12,13.5 L13,16 Z" fill="url(#mtn)"/>
    <path d="M19,16 L20,13.5 L24,12 L28,10.5 L32,12 L32,16 Z" fill="url(#mtn)"/>

    <!-- Halo + soleil plus gros et plus lumineux -->
    <circle cx="16" cy="16" r="9" fill="url(#glow)"/>
    <circle cx="16" cy="16" r="6" fill="url(#sun)"/>
    <g clip-path="url(#sunClip)">
      <rect x="10" y="13.4" width="12" height="0.7" fill="#ff8a28" opacity="0.45"/>
      <rect x="10" y="15.2" width="12" height="0.7" fill="#ff8a28" opacity="0.55"/>
      <rect x="10" y="17.0" width="12" height="0.7" fill="#ff8a28" opacity="0.45"/>
    </g>

    <!-- Mer plus claire -->
    <rect x="0" y="16" width="32" height="7" fill="url(#sea)"/>
    <!-- Reflet solaire en colonne : facettes plus larges et plus vives -->
    <rect x="15.2" y="16.0" width="1.6" height="0.8" fill="#fff0a0" opacity="1"/>
    <rect x="14.6" y="16.8" width="2.8" height="0.8" fill="#ffe872" opacity="0.95"/>
    <rect x="13.8" y="17.6" width="4.4" height="0.8" fill="#ffe872" opacity="0.8"/>
    <rect x="12.8" y="18.4" width="6.4" height="0.8" fill="#ffe872" opacity="0.6"/>
    <rect x="11.6" y="19.2" width="8.8" height="0.8" fill="#ffe872" opacity="0.42"/>
    <rect x="10.4" y="20.0" width="11.2" height="0.8" fill="#ffe872" opacity="0.26"/>
    <rect x="9.6"  y="20.8" width="12.8" height="0.5" fill="#ffe872" opacity="0.16"/>

    <!-- Lisière mer/ponton -->
    <rect x="0" y="23"   width="32" height="0.5" fill="#ffffff" opacity="0.3"/>
    <rect x="0" y="23.5" width="32" height="0.5" fill="#000000" opacity="0.3"/>

    <!-- Ponton gris plus clair -->
    <rect x="0" y="24" width="32" height="8" fill="url(#deck)"/>
    <rect x="0" y="24" width="32" height="3" fill="#ffb060" opacity="0.14"/>
    <!-- Joints de pavés en perspective, plus épais -->
    <g stroke="#000" stroke-opacity="0.26" stroke-width="0.45" fill="none">
      <line x1="1"  y1="32" x2="12.5" y2="24"/>
      <line x1="9"  y1="32" x2="14.5" y2="24"/>
      <line x1="16" y1="32" x2="16"   y2="24"/>
      <line x1="23" y1="32" x2="17.5" y2="24"/>
      <line x1="31" y1="32" x2="19.5" y2="24"/>
    </g>
    <g stroke="#000" stroke-opacity="0.22" stroke-width="0.45" fill="none">
      <line x1="0" y1="26.5" x2="32" y2="26.5"/>
      <line x1="0" y1="29.5" x2="32" y2="29.5"/>
    </g>

    <!-- Arche en bois simplifiée, plus claire -->
    <rect x="10.2" y="9.5" width="2.6" height="14.5" fill="url(#gate)"/>
    <rect x="19.2" y="9.5" width="2.6" height="14.5" fill="url(#gate)"/>
    <rect x="9.6" y="9.5"  width="12.8" height="2.2" fill="#7a4a22"/>
    <rect x="9.6" y="11.7" width="12.8" height="0.7" fill="#2a160a"/>
    <rect x="10.6" y="8"   width="10.8" height="1.3" fill="#6a3a1a"/>
    <!-- 2 points par pilier (lisibles à 16 px) -->
    <g fill="#ffe9a8">
      <rect x="10.8" y="13.5" width="1.4" height="1.4" rx="0.3"/>
      <rect x="10.8" y="18.5" width="1.4" height="1.4" rx="0.3"/>
      <rect x="19.8" y="13.5" width="1.4" height="1.4" rx="0.3"/>
      <rect x="19.8" y="18.5" width="1.4" height="1.4" rx="0.3"/>
    </g>
  </g>
</svg>
